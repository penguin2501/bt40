<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Discovery App - Hồ Quốc Khánh (231A010463)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="logo">🎬 MovieApp</div>
        <div class="theme-toggle-container">
            <span>🌙 Tối</span>
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider round"></span>
            </label>
            <span>☀️ Sáng</span>
        </div>
    </header>

    <!-- Main Container Layout (CSS Grid) -->
    <div class="main-container">
        <!-- Sidebar (Bên trái) -->
        <aside class="sidebar">
            <div class="filter-group">
                <h3>🔍 Tìm kiếm phim</h3>
                <input type="text" id="search-input" placeholder="Nhập tên phim...">
            </div>

            <div class="filter-group">
                <h3>🎭 Thể loại</h3>
                <div id="genre-checkboxes" class="checkbox-list">
                    <!-- Checkbox thể loại sinh tự động từ JS -->
                </div>
            </div>

            <!-- Link tích hợp Bài tập 37, 38, 39 -->
            <div class="filter-group previous-assignments">
                <h3>📂 Bài tập đã làm</h3>
                <ul>
                    <li><a href="https://penguin2501.github.io/bt37/" target="_blank">Bài tập 37</a></li>
                    <li><a href="https://penguin2501.github.io/bt38/" target="_blank">Bài tập 38</a></li>
                    <li><a href="https://penguin2501.github.io/bt39/" target="_blank">Bài tập 39</a></li>
                </ul>
            </div>
        </aside>

        <!-- Main Content (Bên phải) -->
        <main class="content-area">
            <h2>Danh Sách Phim</h2>
            <div id="movie-grid" class="movie-grid">
                <!-- Danh sách Card Phim được sinh tự động bằng JS -->
            </div>
        </main>
    </div>

    <!-- Modal Chi Tiết Phim -->
    <div id="movie-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div class="modal-body" id="modal-body-content">
                <!-- Nội dung chi tiết phim đổ từ JS -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
